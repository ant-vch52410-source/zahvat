<!doctype html>
<!-- «Захват» (задачи 1, 2, 3, 4): поле для голоса и текста, метки-иконки, расход кнопками, последние записи, меню (все записи, счета, выгрузка), чек по QR-коду. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f5fa8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16191d" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Быстрые записи голосом и текстом с выгрузкой в CSV">
  <title>Захват</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Главный экран (задача 3): поле, микрофон, метки-иконки, расход кнопками, последние записи за сегодня -->
  <div id="homeView" class="screen home">
    <header class="bar">
      <h1>Захват</h1>
      <!-- Чек (задача 4): камера читает QR-код кассового чека, запись «Чек: t=…&s=…» уходит на ПК вместе с остальными -->
      <button id="btnScan" class="icon" type="button" aria-label="Чек: считать QR-код">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 20h2"/></svg>
      </button>
      <div class="menu-wrap">
        <button id="btnMenu" class="icon" type="button" aria-label="Меню: все записи, счета, выгрузка" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.6" class="fill"/><circle cx="12" cy="12" r="1.6" class="fill"/><circle cx="12" cy="19" r="1.6" class="fill"/></svg>
        </button>
        <div id="menu" class="menu" role="menu" aria-label="Меню" hidden>
          <p id="menuInfo" class="menu-info"></p>
          <button type="button" role="menuitem" data-act="all">Все записи</button>
          <button type="button" role="menuitem" data-act="lists">Загрузить счета и статьи</button>
          <p id="listsInfo" class="menu-note"></p>
          <hr>
          <button type="button" role="menuitem" data-act="share">Поделиться CSV</button>
          <button type="button" role="menuitem" data-act="download">Скачать CSV</button>
          <button type="button" role="menuitem" data-act="copy">Копировать текст</button>
          <button type="button" role="menuitem" data-act="period">Выгрузить за период / всё…</button>
          <button type="button" role="menuitem" data-act="undo">Отменить отметку выгрузки</button>
          <hr>
          <button type="button" role="menuitem" data-act="backup">Резервная копия JSON</button>
          <button type="button" role="menuitem" data-act="restore">Восстановить из JSON</button>
          <p class="menu-note">Данные хранятся только на этом телефоне.</p>
        </div>
      </div>
    </header>

    <main>
      <section class="compose" aria-label="Новая запись">
        <textarea id="text" rows="2" enterkeyhint="enter" autocapitalize="sentences" aria-label="Текст записи или комментарий к расходу"></textarea>
        <p id="interim" class="interim" aria-live="polite"></p>
        <div class="controls">
          <button id="btnMic" class="mic" type="button" aria-label="Начать диктовку" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" class="fill"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
          </button>
          <div class="side">
            <!-- Метки-иконки: выбранная ставится перед текстом («Финансы: …»); без метки запись станет «Заметка: …» -->
            <div id="tags" class="tags" role="group" aria-label="Метка записи">
              <button type="button" class="tag" data-tag="Финансы" aria-label="Финансы" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h15a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8Zm0 0 3-4h10v4M16 14h.01"/></svg>
              </button>
              <button type="button" class="tag" data-tag="Идеи" aria-label="Идеи" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3Z"/></svg>
              </button>
              <button type="button" class="tag" data-tag="Мысли" aria-label="Мысли" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 1 3.4 6.5L4 20l1.4-3.4A8 8 0 0 1 4 12Z"/></svg>
              </button>
            </div>
            <div class="actions">
              <button id="btnClear" class="clear" type="button">Стереть</button>
              <button id="btnSave" class="save" type="button" disabled>Сохранить</button>
            </div>
          </div>
        </div>
        <p id="status" class="status" role="status"></p>
      </section>

      <hr class="dash">

      <!-- Расход кнопками: сумма со своей клавиатуры (системная не выезжает), счёт, статья -->
      <section class="fin" aria-label="Расход">
        <div class="fin-left">
          <output id="amount" class="amount" aria-label="Сумма">0</output>
          <div id="accounts" class="accounts" role="group" aria-label="Счёт"></div>
          <div id="pad" class="pad" role="group" aria-label="Цифры суммы">
            <button type="button" data-key="1">1</button><button type="button" data-key="2">2</button><button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button><button type="button" data-key="5">5</button><button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button><button type="button" data-key="8">8</button><button type="button" data-key="9">9</button>
            <button type="button" data-key=",">,</button><button type="button" data-key="0">0</button>
            <button type="button" data-key="⌫" aria-label="Стереть цифру">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7 6-7ZM12 9l6 6M18 9l-6 6"/></svg>
            </button>
          </div>
        </div>
        <div id="cats" class="cats" role="group" aria-label="Статья расхода"></div>
      </section>

      <hr class="dash">

      <ul id="recent" class="recent" aria-label="Последние записи за сегодня"></ul>
    </main>
  </div>

  <!-- Все записи (из меню): поиск, правка, удаление; «Назад» телефона возвращает на главный -->
  <div id="allView" class="screen" hidden>
    <header class="bar">
      <button id="btnBack" class="icon" type="button" aria-label="Назад">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 id="feedTitle">Все записи</h1>
    </header>
    <main>
      <section class="search">
        <input id="search" type="search" placeholder="Поиск по всем записям" aria-label="Поиск по всем записям" autocomplete="off">
      </section>
      <ul id="feed" class="feed"></ul>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toastText"></span>
    <button id="toastAction" type="button" hidden></button>
  </div>

  <dialog id="exportDlg" aria-labelledby="exportTitle">
    <form method="dialog" id="exportForm">
      <h2 id="exportTitle">Выгрузка CSV</h2>
      <fieldset>
        <legend>Какие записи</legend>
        <label><input type="radio" name="mode" value="new"> Только новые</label>
        <label><input type="radio" name="mode" value="period" checked> За период</label>
        <label><input type="radio" name="mode" value="all"> Всё</label>
      </fieldset>
      <div id="periodBox" class="period">
        <label>С <input type="date" name="from"></label>
        <label>По <input type="date" name="to"></label>
      </div>
      <p id="exportCount" class="hint"></p>
      <div class="dlg-actions">
        <button type="submit" value="share" class="save">Поделиться</button>
        <button type="submit" value="download">Скачать</button>
        <button type="submit" value="copy">Копировать</button>
        <button type="submit" value="cancel" class="ghost">Закрыть</button>
      </div>
    </form>
  </dialog>

  <!-- Чек по QR (задача 4): видео с камеры; не читается — «Фото» (снимок или картинка из галереи) -->
  <dialog id="scanDlg" class="scan" aria-labelledby="scanTitle">
    <h2 id="scanTitle">Чек</h2>
    <video id="scanVideo" playsinline muted></video>
    <p id="scanHint" class="hint">Наведите камеру на QR-код чека</p>
    <div class="dlg-actions">
      <button id="btnScanPhoto" type="button">Фото</button>
      <button id="btnScanClose" type="button" class="ghost">Закрыть</button>
    </div>
  </dialog>

  <input id="fileRestore" type="file" accept=".json,application/json" hidden>
  <input id="fileLists" type="file" accept=".txt,text/plain" hidden>
  <input id="filePhoto" type="file" accept="image/*" capture="environment" hidden>
</body>
</html>
